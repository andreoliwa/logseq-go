# To install the git pre-commit hook run:
#   pre-commit install
# To update the pre-commit hooks run:
#   pre-commit install-hooks
ci:
  autoupdate_schedule: quarterly
  autofix_commit_msg: "chore(deps): auto fixes from pre-commit.com hooks\n\nfor more information, see https://pre-commit.ci"
  autoupdate_commit_msg: "chore(deps): pre-commit autoupdate"

repos:
  # TODO: build: remove this hook once this fork is merged into upstream
  - repo: local
    hooks:
      - id: find-upstream-references
        name: Find upstream references
        language: system
        entry: bash -c 'grep -r aholstenson "$@" && exit 1 || exit 0' --
        types: [text]
        exclude: '^go\.sum$|^\.pre-commit-config\.yaml$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Some test files are testing exactly trailing spaces and can't be removed
        exclude: '^testdata/.*\.md$|.*/testdata/.*\.md$'
      - id: end-of-file-fixer
      - id: debug-statements
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.2
    hooks:
      - id: toml-sort-fix
        exclude: '.*\.lock$'
  - repo: https://github.com/google/keep-sorted
    rev: v0.6.0
    hooks:
      - id: keep-sorted
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        stages:
          - pre-commit
        args:
          # So it doesn't fail when I'm trying to commit only Markdown files in the testdata dir
          # https://prettier.io/docs/cli#--no-error-on-unmatched-pattern
          - --no-error-on-unmatched-pattern
  - repo: https://github.com/mxr/sync-pre-commit-deps
    rev: v0.0.3
    hooks:
      - id: sync-pre-commit-deps
