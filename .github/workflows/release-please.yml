name: Release

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check release credentials
        env:
          RELEASE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'Configure the repository-scoped GH_TOKEN secret in the Release environment.' >&2
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-notes:
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          version: v2.14.2
          args: --version
      - name: Add git-cliff to PATH
        run: echo "$RUNNER_TEMP/git-cliff/bin" >> "$GITHUB_PATH"
      - name: Render notes for the event tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/release-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      # Do not infer fork issue/PR identities from imported commit messages.
      - name: Update this release's notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
