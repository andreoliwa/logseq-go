[changelog]
body = """
## What's Changed
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/andreoliwa/logseq-go/commit/{{ commit.id }})) - {{ commit.author.name }}
{% endfor %}
{% endfor %}
"""
footer = ""
header = ""
trim = true

[git]
commit_parsers = [
  {group = "Features", message = "^feat"},
  {group = "Bug Fixes", message = "^fix"},
  {group = "Performance", message = "^perf"},
  {group = "Documentation", message = "^docs"},
  {group = "Refactoring", message = "^refactor"},
  {group = "Testing", message = "^test"},
  {group = "Other Changes", message = ".*"}
]
# Imported issue numbers have no reliable fork-local meaning. Keep them as
# escaped text instead of linking them to unrelated issues or posting comments.
commit_preprocessors = [{pattern = '#([0-9]+)', replace = '\#$1'}]
conventional_commits = true
filter_commits = false
filter_unconventional = false
protect_breaking_commits = true
sort_commits = "oldest"
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = true
use_branch_tags = true
